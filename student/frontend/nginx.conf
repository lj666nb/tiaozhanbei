server {
    listen       80;
    server_name  localhost;

    # 静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;  # SPA 路由回退
    }

    # 作业管理 API → 教师端后端
    location /api/assignments {
        proxy_pass http://host.docker.internal:8002/api/assignments;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # 师生通信 API → 教师端后端 (SSE 长连接需关闭缓冲)
    location /api/messaging {
        proxy_pass http://host.docker.internal:8002/api/messaging;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # 课程管理 API → 教师端后端
    location /api/course-mgmt {
        proxy_pass http://host.docker.internal:8002/api/course-mgmt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # API 代理到学生端后端
    location /api/ {
        proxy_pass http://host.docker.internal:8001;
        # Agent 导师和终端都需要逐片段到达浏览器，不能由代理攒成整段。
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
}
