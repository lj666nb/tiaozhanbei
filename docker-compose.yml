# ─── AI智能体学科学习平台 — 根目录一键启动 ─────────────────
#   docker compose up -d
#
# 大前端 → http://localhost:9000
# 学生端 → http://localhost:80
# 教师端 → http://localhost:8080

services:
  # ============================================================
  #  大前端 — 统一入口页面
  # ============================================================
  portal:
    image: nginx:alpine
    container_name: edu-platform-portal
    ports:
      - "9000:80"
    volumes:
      - ./portal/index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped

  # ============================================================
  #  学生端服务
  # ============================================================
  student-backend:
    build: ./student/backend
    container_name: ai-learning-backend
    ports:
      - "8001:8000"
    volumes:
      - student_backend_data:/app/data
      - ./student/backend/data:/app/seed-data:ro
      - ./student/learning_materials:/learning_materials:ro
      - ./student/pdf:/pdf:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-}
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - LAB_RUNTIME_EXECUTION_ENABLED=${LAB_RUNTIME_EXECUTION_ENABLED:-false}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - EMBEDDING_RUNTIME_MODE=siliconflow
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_BASE_URL=https://api.siliconflow.cn/v1
      - EMBEDDING_MEMORY_CACHE_SIZE=256
      - LOCAL_GPU_MODEL_AUTO=1
      - LOCAL_GPU_MODEL_BASE_URL=http://host.docker.internal:8010/v1
      - LOCAL_GPU_MODEL_NAME=tiaozhanbei-qwen3-1.7b-local
    command: ["sh", "/app/docker-entrypoint.sh"]
    restart: unless-stopped
    networks:
      - student-net

  student-frontend:
    build: ./student/frontend
    container_name: ai-learning-frontend
    ports:
      - "80:80"
    depends_on:
      - student-backend
    restart: unless-stopped
    networks:
      - student-net

  # ============================================================
  #  教师端服务
  # ============================================================
  teacher-backend:
    build:
      context: ./teacher/backend
      dockerfile: Dockerfile
    container_name: edu-ta-backend
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      - TZ=Asia/Shanghai
      - DATA_DIR=/app/data
      - DATABASE_URL=postgresql+psycopg2://app_user:${DB_PASSWORD:-123456}@113.45.66.152:5432/tiaozhanbei
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
      - LLM_MODEL_NAME=${LLM_MODEL_NAME:-gpt-4o-mini}
      - EMBEDDING_MODEL_NAME=${EMBEDDING_MODEL_NAME:-BAAI/bge-small-zh-v1.5}
      - VECTOR_DB_PATH=/app/knowledge_base/vector_store
      - PROJECT_ID=${PROJECT_ID:-ta-project}
      - PROJECT_TOKEN=${PROJECT_TOKEN:-}
    volumes:
      - edu-ta-vector-store:/app/knowledge_base/vector_store
      - edu-ta-textbooks:/app/knowledge_base/textbooks
      - edu-ta-materials:/app/knowledge_base/materials
      - edu-ta-data:/app/data
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      edu-ta-network:
        aliases:
          - backend

  teacher-frontend:
    build:
      context: ./teacher/frontend
      dockerfile: Dockerfile
    container_name: edu-ta-frontend
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8080:80"
    depends_on:
      teacher-backend:
        condition: service_healthy
    stop_grace_period: 10s
    networks:
      - edu-ta-network

networks:
  student-net:
    driver: bridge
  edu-ta-network:
    driver: bridge

volumes:
  student_backend_data:
  edu-ta-vector-store:
  edu-ta-textbooks:
  edu-ta-materials:
  edu-ta-data:
